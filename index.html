<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MKIS hunter</title>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MKIS hunter">
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --line:#2e333d;
    --text:#f0f2f5; --dim:#a6adbb; --gold:#e8b339;
    --ok:#3ecf7e; --no:#6b7280; --mine:#59a6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Thai",sans-serif;
    font-size:18px;line-height:1.55;padding-bottom:30px}

  /* ---------- header แบบบาง ---------- */
  header{position:sticky;top:0;z-index:30;background:#0f1115f2;backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:8px 14px 9px;transition:transform .22s ease}
  header.hide{transform:translateY(-102%)}
  .top{display:flex;align-items:center;gap:10px}
  .logo{width:32px;height:32px;border-radius:8px;flex:0 0 auto}
  h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;color:var(--gold);flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who{font-size:14px;color:var(--dim);cursor:pointer;white-space:nowrap}
  .who b{color:var(--gold)}

  .rowline{display:flex;gap:7px;margin-top:8px;align-items:center}
  select,input[type=search]{background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:9px 11px;font-size:16px;font-family:inherit;min-width:0}
  select{flex:0 0 auto;max-width:48%}
  input[type=search]{flex:1}
  .chips{display:flex;gap:6px;margin-top:7px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:6px 13px;font-size:15px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .chip.on{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700}
  .chip.mineon{background:var(--mine);color:#04182e;border-color:var(--mine);font-weight:700}

  .bar{padding:9px 14px;font-size:15px;color:#cfd6e0;background:#151922;border-bottom:1px solid var(--line)}
  .bar b{color:var(--gold)}

  /* ---------- รายการแบบย่อ ---------- */
  main{padding:8px 12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .item.open{border-color:#4a5262}
  .item.mine{border-left:4px solid var(--mine)}
  .item.book{border-left:4px solid var(--gold)}
  .item.shut{opacity:.42}

  .head{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:#3a4150}
  .dot.talked{background:var(--gold)} .dot.sample{background:#7fd4ff}
  .dot.order{background:var(--ok)} .dot.miss{background:var(--no)}
  .dot.reject{background:#8a3a3a} .dot.book{background:var(--gold);box-shadow:0 0 0 3px #e8b33933}
  .ttl{flex:1;min-width:0}
  .ttl .n{font-size:17px;font-weight:700;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .ttl .sub{font-size:13.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl .sub .tag{color:var(--gold)}
  .ttl .sub .by{color:var(--mine)}
  .tel{flex:0 0 auto;background:#1e3a2a;border:1px solid #2f5a42;border-radius:9px;
    padding:9px 12px;font-size:17px;text-decoration:none;line-height:1}
  .tel.off{background:var(--card2);border-color:var(--line);opacity:.5}
  .star{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);border-radius:9px;
    padding:8px 11px;font-size:18px;line-height:1;cursor:pointer;font-family:inherit;color:#5a6270}
  .star.me{background:#3b2f00;border-color:#8a6b12;color:#ffd35c}
  .star.other{background:#2a2438;border-color:#4b3f6b;color:#b9a6ff}

  .detail{padding:0 12px 12px;border-top:1px solid #262b35}
  .w{font-size:15.5px;color:#d5dae2;margin:10px 0 4px}
  .m{font-size:14.5px;color:var(--dim);margin-bottom:10px}
  .m b{color:#ffd77a;font-weight:600}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
  .b{font-size:13px;padding:3px 9px;border-radius:999px;font-weight:600}
  .b.robot{background:#3b2f00;color:#ffd35c}
  .b.jp{background:#3a1420;color:#ff9db0}
  .b.brand{background:#132c3a;color:#7fd4ff}
  .b.warn{background:#3d1414;color:#ff8f8f}
  .links{display:flex;gap:8px;margin-bottom:10px}
  .links a{background:var(--card2);color:var(--dim);border:1px solid var(--line);
    padding:8px 14px;border-radius:9px;text-decoration:none;font-size:15px}
  .status{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
  .s{flex:1 1 auto;background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:8px;padding:9px 4px;font-size:14.5px;cursor:pointer;font-family:inherit;min-width:64px}
  .s.on{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700}
  .s.on[data-v="ไม่ติด"]{background:var(--no);color:#fff;border-color:var(--no)}
  .s.on[data-v="สั่งแล้ว"]{background:var(--ok);color:#04220f;border-color:var(--ok)}
  .s.on[data-v="ไม่เอา"]{background:#4a2020;color:#ff9f9f;border-color:#6b2c2c}
  textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:10px 12px;font-size:15.5px;font-family:inherit;resize:vertical;min-height:54px}
  .stamp{font-size:13.5px;color:var(--dim);margin-top:7px}
  .stamp b{color:#8fd6a6}
  .saving{color:var(--gold)} .err{color:#ff9f9f}
  .empty,.load{text-align:center;color:var(--dim);padding:36px 16px;font-size:17px}

  .more{display:block;width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:13px;font-size:17px;font-family:inherit;cursor:pointer;margin:4px 0 10px}

  .mask{position:fixed;inset:0;z-index:99;background:#0f1115f2;display:flex;
    align-items:center;justify-content:center;padding:24px}
  .ask{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:400px}
  .ask h2{margin:0 0 6px;font-size:22px;color:var(--gold)}
  .ask p{margin:0 0 16px;font-size:15.5px;color:var(--dim)}
  .ask input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:13px 15px;font-size:18px;font-family:inherit;margin-bottom:14px}
  .ask button{width:100%;background:var(--gold);color:#1a1200;border:0;border-radius:10px;
    padding:14px;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer}
</style>
</head>
<body>

<header id="hdr">
  <div class="top">
    <img class="logo" src="icon-192.png" alt="">
    <h1>MKIS hunter</h1>
    <span class="who" id="who">—</span>
  </div>
  <div class="rowline">
    <select id="selGroup"></select>
    <select id="selZone"></select>
  </div>
  <div class="rowline">
    <input type="search" id="q" placeholder="ค้นชื่อ / พื้นที่ / เบอร์">
  </div>
  <div class="chips">
    <button class="chip" id="cMine">⭐ ของฉัน</button>
    <button class="chip" id="cBook">🔒 จองแล้ว</button>
    <button class="chip" id="cLeft">ยังว่าง</button>
    <button class="chip" id="cHot">เด่น</button>
    <button class="chip" id="cOpen">กางทั้งหมด</button>
  </div>
</header>

<div class="bar" id="bar">กำลังโหลด…</div>
<main id="list"><div class="load">กำลังดึงข้อมูล…</div></main>

<script>
var API = "https://script.google.com/macros/s/AKfycbzW3T6Lhi1Ez1CcNUHOFESSmRA30m02XfniDAkJ87CvC_2n2z3C55e5ndDXRh5BJKzuXw/exec";

var DATA = { targets: [], results: {} };
var group = "all", zone = "all";
var fMine = false, fBook = false, fLeft = false, fHot = false, expandAll = false;
var shown = 40;                       // แสดงทีละ 40 แล้วค่อยกดโหลดเพิ่ม
var openIds = {};                     // การ์ดที่กางอยู่

var BOOK = "จองไว้";
var STATUS = [BOOK, "ไม่ติด", "คุยแล้ว", "ส่งตัวอย่าง", "สั่งแล้ว", "ไม่เอา"];
var DOT = { "จองไว้":"book", "ไม่ติด":"miss", "คุยแล้ว":"talked", "ส่งตัวอย่าง":"sample", "สั่งแล้ว":"order", "ไม่เอา":"reject" };
var BADGE = {
  robot:{t:"⭐ หุ่นยนต์เชื่อม",c:"robot"}, jp:{t:"🏭 ทุนต่างชาติ",c:"jp"},
  brand:{t:"🔧 รู้แบรนด์เครื่อง",c:"brand"}, paint:{t:"🎨 บอกยี่ห้อสี",c:"robot"},
  booth:{t:"🔥 มีห้องอบสี",c:"brand"}, oem:{t:"🚗 ศูนย์มาตรฐานค่ายรถ",c:"jp"},
  ins:{t:"🛡️ อู่ในเครือประกัน",c:"brand"}, warn:{t:"⚠️ ไม่ใช่ลูกค้า",c:"warn"}
};
var HOT = ["robot","jp","paint","booth","oem"];

function ls(k, v){
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }
  catch(e){ return null; }
}
function me(){ return ls("mb_who") || ""; }

function askName(force){
  if (!force && me()) return;
  var mask = document.createElement("div");
  mask.className = "mask";
  mask.innerHTML = '<div class="ask"><h2>คุณชื่ออะไร</h2>' +
    '<p>ใส่ชื่อไว้ เพื่อให้ทีมรู้ว่าใครจองเจ้าไหน และใครบันทึกผล</p>' +
    '<input type="text" id="nameIn" placeholder="เช่น ตั้ม" autocomplete="name">' +
    '<button id="nameOk">เริ่มใช้งาน</button></div>';
  document.body.appendChild(mask);
  var input = mask.querySelector("#nameIn");
  input.value = me();
  setTimeout(function(){ try { input.focus(); } catch(e){} }, 100);
  function done(){
    ls("mb_who", (input.value || "").trim() || "ไม่ระบุชื่อ");
    document.getElementById("who").innerHTML = "👤 <b>" + me() + "</b>";
    document.body.removeChild(mask);
    render();
  }
  mask.querySelector("#nameOk").onclick = done;
  input.onkeydown = function(e){ if (e.key === "Enter") done(); };
}

document.getElementById("who").innerHTML = "👤 <b>" + (me() || "ใส่ชื่อ") + "</b>";
document.getElementById("who").onclick = function(){ askName(true); };

function chip(id, flagName){
  var el = document.getElementById(id);
  el.onclick = function(){
    if (flagName === "mine") { fMine = !fMine; el.className = "chip" + (fMine ? " mineon" : ""); }
    if (flagName === "book") { fBook = !fBook; el.className = "chip" + (fBook ? " on" : ""); }
    if (flagName === "left") { fLeft = !fLeft; el.className = "chip" + (fLeft ? " on" : ""); }
    if (flagName === "hot")  { fHot  = !fHot;  el.className = "chip" + (fHot  ? " on" : ""); }
    if (flagName === "open") {
      expandAll = !expandAll; el.className = "chip" + (expandAll ? " on" : "");
      el.textContent = expandAll ? "ย่อทั้งหมด" : "กางทั้งหมด";
    }
    shown = 40; render();
  };
}
chip("cMine","mine"); chip("cBook","book"); chip("cLeft","left"); chip("cHot","hot"); chip("cOpen","open");
document.getElementById("q").oninput = function(){ shown = 40; render(); };

// ซ่อน header ตอนเลื่อนลง โชว์ตอนเลื่อนขึ้น
var lastY = 0;
window.addEventListener("scroll", function(){
  var y = window.scrollY || 0;
  var hdr = document.getElementById("hdr");
  if (y > 140 && y > lastY + 6) hdr.classList.add("hide");
  else if (y < lastY - 6 || y < 90) hdr.classList.remove("hide");
  lastY = y;
}, { passive: true });

function call(params){
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
  }).join("&");
  return fetch(API + "?" + qs).then(function(r){ return r.json(); });
}

// บันทึกแบบมองเห็นผลทันที (ไม่ต้องรอเซิร์ฟเวอร์ตอบ)
function saveFor(t, status, note, onFail){
  if (!me()) { askName(true); return; }
  var prev = DATA.results[t.id];
  DATA.results[t.id] = { status: status, note: note, who: me(), at: "กำลังบันทึก…" };
  render();
  call({ action:"save", id:t.id, name:t.n, status:status, note:note, who:me() })
    .then(function(res){
      if (!res.ok) throw new Error("");
      DATA.results[t.id] = { status: status, note: note, who: me(), at: res.at };
      cacheSave(); render();
    })
    .catch(function(){
      if (prev) DATA.results[t.id] = prev; else delete DATA.results[t.id];
      render();
      if (onFail) onFail(); else alertBar("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง");
    });
}
function alertBar(msg){
  var b = document.getElementById("bar");
  var old = b.innerHTML;
  b.innerHTML = '<span class="err">' + msg + '</span>';
  setTimeout(function(){ b.innerHTML = old; }, 2500);
}

// ---------- แคชในเครื่อง: เปิดแอปแล้วเห็นทันที ไม่ต้องรอ ----------
var CACHE_KEY = "mb_cache_v1";
function cacheSave(){ try { ls(CACHE_KEY, JSON.stringify(DATA)); } catch(e){} }
function cacheLoad(){
  try {
    var raw = ls(CACHE_KEY);
    if (!raw) return false;
    var d = JSON.parse(raw);
    if (!d || !d.targets || !d.targets.length) return false;
    DATA = d; buildSelects(); render();
    return true;
  } catch(e){ return false; }
}

function load(quiet){
  call({ action: "list", t: Date.now() })
    .then(function(d){
      if (!d.ok) throw new Error(d.error || "");
      DATA = d; cacheSave(); buildSelects(); render();
    })
    .catch(function(e){
      if (quiet) return;   // มีแคชอยู่แล้ว ไม่ต้องรบกวน
      document.getElementById("list").innerHTML =
        '<div class="empty err">โหลดไม่ได้: ' + (e.message || e) + '<br><br>เช็คเน็ตแล้วลองใหม่</div>';
    });
}

function uniq(key, rows){
  var out = [], seen = {};
  rows.forEach(function(t){ if (t[key] && !seen[t[key]]) { seen[t[key]] = 1; out.push(t[key]); } });
  return out;
}

function buildSelects(){
  var sg = document.getElementById("selGroup"), sz = document.getElementById("selZone");
  if (!sg.getAttribute("data-built")) {
    sg.setAttribute("data-built", "1");
    var gs = uniq("group", DATA.targets);
    sg.innerHTML = '<option value="all">ทุกประเภท (' + DATA.targets.length + ')</option>' +
      gs.map(function(g){
        var c = DATA.targets.filter(function(t){ return t.group === g; }).length;
        return '<option value="' + g + '">' + g + ' (' + c + ')</option>';
      }).join("");
    sg.onchange = function(){ group = this.value; zone = "all"; shown = 40; fillZones(); render(); };
  }
  fillZones();
}
function fillZones(){
  var sz = document.getElementById("selZone");
  var rows = DATA.targets.filter(function(t){ return group === "all" || t.group === group; });
  var zs = uniq("zone", rows);
  sz.innerHTML = '<option value="all">ทุกโซน (' + rows.length + ')</option>' +
    zs.map(function(z){
      var c = rows.filter(function(t){ return t.zone === z; }).length;
      return '<option value="' + z + '">' + z + ' (' + c + ')</option>';
    }).join("");
  sz.value = zone;
  sz.onchange = function(){ zone = this.value; shown = 40; render(); };
}

function visible(){
  var term = document.getElementById("q").value.trim().toLowerCase();
  var myName = me();
  return DATA.targets.filter(function(t){
    if (group !== "all" && t.group !== group) return false;
    if (zone !== "all" && t.zone !== zone) return false;
    var r = DATA.results[t.id] || {};
    if (fMine && r.who !== myName) return false;
    if (fBook && r.status !== BOOK) return false;
    if (fLeft && r.status) return false;
    if (fHot && !t.f.some(function(x){ return HOT.indexOf(x) >= 0; })) return false;
    if (term) {
      var hay = (t.n + " " + t.a + " " + t.w + " " + t.m + " " + t.p).toLowerCase();
      if (hay.indexOf(term) < 0) return false;
    }
    return true;
  });
}

function render(){
  var rows = visible(), list = document.getElementById("list");
  var myName = me();
  list.innerHTML = "";

  var all = DATA.targets.filter(function(t){ return group === "all" || t.group === group; });
  var done = 0, mine = 0, booked = 0, c = {};
  all.forEach(function(t){
    var r = DATA.results[t.id];
    if (r && r.status) {
      done++; c[r.status] = (c[r.status] || 0) + 1;
      if (r.status === BOOK) booked++;
      if (r.who === myName) mine++;
    }
  });
  document.getElementById("bar").innerHTML =
    "เข้าไปแล้ว <b>" + done + "</b>/" + all.length +
    " · จองไว้ <b>" + booked + "</b>" +
    " · คุยแล้ว <b>" + (c["คุยแล้ว"] || 0) + "</b>" +
    " · ตัวอย่าง <b>" + (c["ส่งตัวอย่าง"] || 0) + "</b>" +
    " · สั่งแล้ว <b>" + (c["สั่งแล้ว"] || 0) + "</b>" +
    (myName ? " · ของฉัน <b>" + mine + "</b>" : "") +
    " &nbsp;|&nbsp; แสดง " + Math.min(shown, rows.length) + "/" + rows.length;

  if (!rows.length) { list.innerHTML = '<div class="empty">ไม่มีรายการตามที่กรอง</div>'; return; }

  rows.slice(0, shown).forEach(function(t){ list.appendChild(itemEl(t, myName)); });

  if (rows.length > shown) {
    var b = document.createElement("button");
    b.className = "more";
    b.textContent = "โหลดเพิ่มอีก " + Math.min(40, rows.length - shown) + " รายการ (เหลือ " + (rows.length - shown) + ")";
    b.onclick = function(){ shown += 40; render(); };
    list.appendChild(b);
  }
}

function itemEl(t, myName){
  var r = DATA.results[t.id] || {};
  var isOpen = expandAll || openIds[t.id];
  var el = document.createElement("div");
  el.className = "item" +
    (isOpen ? " open" : "") +
    (r.status === BOOK ? " book" : "") +
    (r.who && r.who === myName ? " mine" : "") +
    (r.status === "สั่งแล้ว" || r.status === "ไม่เอา" ? " shut" : "");

  var sub = t.a;
  if (r.status) sub = '<span class="tag">' + r.status + '</span>' +
    (r.who ? ' <span class="by">· ' + r.who + '</span>' : '') + ' · ' + t.a;

  var tel = t.p
    ? '<a class="tel" href="tel:' + String(t.p).replace(/[^0-9+]/g,"") + '" onclick="event.stopPropagation()">📞</a>'
    : '<span class="tel off">📞</span>';

  var booked = r.status === BOOK;
  var mineBook = booked && r.who === myName;
  var starCls = mineBook ? "star me" : (booked ? "star other" : "star");

  el.innerHTML =
    '<div class="head">' +
      '<span class="dot ' + (DOT[r.status] || "") + '"></span>' +
      '<span class="ttl"><div class="n">' + t.n + '</div><div class="sub">' + sub + '</div></span>' +
      '<button class="' + starCls + '">' + (booked ? "★" : "☆") + '</button>' +
      tel +
    '</div>';

  el.querySelector(".star").onclick = function(ev){
    ev.stopPropagation();
    if (!me()) { askName(true); return; }
    if (booked && !mineBook) {           // คนอื่นจองอยู่ — ไม่แย่ง
      var s = el.querySelector(".sub");
      s.innerHTML = '<span class="by">🔒 ' + r.who + ' จองเจ้านี้ไว้แล้ว</span>';
      setTimeout(render, 1800);
      return;
    }
    saveFor(t, mineBook ? "" : BOOK, (DATA.results[t.id] || {}).note || "");
  };

  el.querySelector(".head").onclick = function(){
    if (expandAll) { expandAll = false; document.getElementById("cOpen").className = "chip"; document.getElementById("cOpen").textContent = "กางทั้งหมด"; openIds = {}; openIds[t.id] = 1; }
    else { if (openIds[t.id]) delete openIds[t.id]; else openIds[t.id] = 1; }
    render();
  };

  if (!isOpen) return el;

  var badges = "";
  t.f.forEach(function(f){ if (BADGE[f]) badges += '<span class="b ' + BADGE[f].c + '">' + BADGE[f].t + '</span>'; });

  var d = document.createElement("div");
  d.className = "detail";
  d.innerHTML =
    (badges ? '<div class="badges" style="margin-top:10px">' + badges + '</div>' : '') +
    '<div class="w">' + t.w + '</div>' +
    (t.m && t.m !== "-" ? '<div class="m"><b>' + t.m + '</b></div>' : '') +
    '<div class="links">' +
      (t.p ? '<a href="tel:' + String(t.p).replace(/[^0-9+]/g,"") + '">📞 ' + t.p + '</a>' : '<a style="opacity:.5">ยังไม่มีเบอร์</a>') +
      (t.u ? '<a href="' + t.u + '" target="_blank" rel="noopener">เว็บ</a>' : '') +
    '</div>' +
    '<div class="status"></div>' +
    '<textarea placeholder="โน้ต — คุยกับใคร ใช้ยี่ห้ออะไรอยู่ นัดเมื่อไหร่"></textarea>' +
    '<div class="stamp"></div>';

  var stamp = d.querySelector(".stamp");
  var ta = d.querySelector("textarea");
  ta.value = r.note || "";
  function showStamp(){
    var rr = DATA.results[t.id] || {};
    stamp.innerHTML = rr.who ? ("บันทึกโดย <b>" + rr.who + "</b> · " + (rr.at || "")) : "";
  }
  showStamp();

  function save(status, note){
    stamp.innerHTML = '<span class="saving">กำลังบันทึก…</span>';
    saveFor(t, status, note, function(){ stamp.innerHTML = '<span class="err">บันทึกไม่สำเร็จ ลองใหม่</span>'; });
  }

  var sc = d.querySelector(".status");
  STATUS.forEach(function(v){
    var b = document.createElement("button");
    b.className = "s" + (r.status === v ? " on" : "");
    b.setAttribute("data-v", v);
    b.textContent = v === BOOK ? "🔖 จองไว้" : v;
    b.onclick = function(){
      var cur = (DATA.results[t.id] || {}).status;
      save(cur === v ? "" : v, ta.value);
    };
    sc.appendChild(b);
  });

  var timer = null;
  ta.oninput = function(){
    clearTimeout(timer);
    timer = setTimeout(function(){ save((DATA.results[t.id] || {}).status || "", ta.value); }, 1500);
  };

  el.appendChild(d);
  return el;
}

askName(false);
var hadCache = cacheLoad();          // เห็นข้อมูลทันทีจากแคชในเครื่อง
load(hadCache);                      // แล้วค่อยดึงของใหม่มาทับเงียบๆ
setInterval(function(){ load(true); }, 45000);
</script>
</body>
</html>
