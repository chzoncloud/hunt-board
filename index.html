<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MKIS hunter</title>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MKIS hunter">
<style>
  :root{
    --bg:#0f1115; --card:#191c23; --card2:#22262f; --line:#2a2f39;
    --text:#f0f2f5; --dim:#9aa2b1; --gold:#e8b339;
    --ok:#3ecf7e; --no:#6b7280; --mine:#59a6ff;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Thai",sans-serif;
    font-size:18px;line-height:1.55;
    padding-bottom:calc(34px + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing:antialiased}

  header{position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,#0f1115 62%,#0f1115e0 100%);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
    transition:transform .26s cubic-bezier(.22,.7,.3,1);
    padding:calc(10px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-right, 0px))
            10px calc(14px + env(safe-area-inset-left, 0px))}
  @supports (padding-top: env(safe-area-inset-top)){ header{padding-top:max(10px, env(safe-area-inset-top))} }
  header.hide{transform:translateY(-102%)}

  .top{display:flex;align-items:center;gap:10px}
  .logo{width:32px;height:32px;border-radius:9px;flex:0 0 auto;box-shadow:0 2px 10px #0006}
  h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px;color:var(--gold);flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who{font-size:14px;color:var(--dim);cursor:pointer;white-space:nowrap;
    padding:5px 10px;border-radius:999px;background:var(--card2);transition:background .18s}
  .who:active{background:#2c313c}
  .who b{color:var(--gold)}

  .rowline{display:flex;gap:7px;margin-top:9px;align-items:center}
  select,input[type=search]{background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 11px;font-size:16px;font-family:inherit;min-width:0;
    transition:border-color .18s}
  select:focus,input[type=search]:focus{outline:none;border-color:#4a5262}
  select{flex:1 1 0;max-width:50%}
  input[type=search]{flex:1;width:100%}
  .chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;
    padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;font-family:inherit;
    white-space:nowrap;transition:background .18s,color .18s,border-color .18s,transform .12s}
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700}
  .chip.mineon{background:var(--mine);color:#04182e;border-color:var(--mine);font-weight:700}

  .bar{font-size:15px;color:#cfd6e0;background:#141820;border-bottom:1px solid var(--line);
    padding:10px calc(14px + env(safe-area-inset-right,0px)) 10px calc(14px + env(safe-area-inset-left,0px));
    display:flex;align-items:center;gap:8px}
  .bar b{color:var(--gold)}
  .bar .sync{width:7px;height:7px;border-radius:50%;background:#39415080;flex:0 0 auto;transition:background .3s}
  .bar .sync.busy{background:var(--gold);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  main{padding:9px calc(12px + env(safe-area-inset-right,0px)) 9px calc(12px + env(safe-area-inset-left,0px))}

  .item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    margin-bottom:9px;overflow:hidden;
    transition:border-color .2s,opacity .25s,background .2s;
    animation:rise .26s cubic-bezier(.22,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .item.open{border-color:#454d5c;background:#1c2028}
  .item.mine{box-shadow:inset 3px 0 0 var(--mine)}
  .item.book{box-shadow:inset 3px 0 0 var(--gold)}
  .item.shut{opacity:.4}

  .head{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;
    transition:background .16s}
  .head:active{background:#20242c}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:#39414f;transition:background .2s}
  .dot.talked{background:var(--gold)} .dot.sample{background:#7fd4ff}
  .dot.order{background:var(--ok)} .dot.miss{background:var(--no)}
  .dot.reject{background:#8a3a3a}
  .dot.book{background:var(--gold);box-shadow:0 0 0 3px #e8b33930}
  .ttl{flex:1;min-width:0}
  .ttl .n{font-size:17px;font-weight:700;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .ttl .sub{font-size:13.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl .sub .tag{color:var(--gold)}
  .ttl .sub .by{color:var(--mine)}
  .tel{flex:0 0 auto;background:#1c3527;border:1px solid #2d5440;border-radius:10px;
    padding:9px 12px;font-size:17px;text-decoration:none;line-height:1;transition:transform .12s,background .16s}
  .tel:active{transform:scale(.92);background:#24462f}
  .tel.off{background:var(--card2);border-color:var(--line);opacity:.45}
  .star{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);border-radius:10px;
    padding:8px 11px;font-size:18px;line-height:1;cursor:pointer;font-family:inherit;color:#5a6270;
    transition:transform .16s cubic-bezier(.16,1,.3,1),background .18s,color .18s,border-color .18s}
  .star:active{transform:scale(.88)}
  .star.pop{animation:pop .42s cubic-bezier(.16,1,.3,1)}
  @keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(1)}}
  .star.me{background:#3b2f00;border-color:#8a6b12;color:#ffd35c}
  .star.other{background:#26223a;border-color:#443b66;color:#b3a3ff}

  .detail{padding:0 12px 12px;border-top:1px solid #23272f;
    animation:fade .22s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .w{font-size:15.5px;color:#d2d8e0;margin:10px 0 4px}
  .m{font-size:14.5px;color:var(--dim);margin-bottom:10px}
  .m b{color:#ffd77a;font-weight:600}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
  .b{font-size:13px;padding:3px 9px;border-radius:999px;font-weight:600}
  .b.robot{background:#3b2f00;color:#ffd35c}
  .b.jp{background:#3a1420;color:#ff9db0}
  .b.brand{background:#132c3a;color:#7fd4ff}
  .b.warn{background:#3d1414;color:#ff8f8f}
  .links{display:flex;gap:8px;margin-bottom:10px}
  .links a{background:var(--card2);color:var(--dim);border:1px solid var(--line);
    padding:9px 14px;border-radius:10px;text-decoration:none;font-size:15px}
  .status{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
  .s{flex:1 1 auto;background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:9px;padding:9px 4px;font-size:14.5px;cursor:pointer;font-family:inherit;min-width:64px;
    transition:background .16s,color .16s,border-color .16s,transform .12s}
  .s:active{transform:scale(.96)}
  .s.on{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700}
  .s.on[data-v="ไม่ติด"]{background:var(--no);color:#fff;border-color:var(--no)}
  .s.on[data-v="สั่งแล้ว"]{background:var(--ok);color:#04220f;border-color:var(--ok)}
  .s.on[data-v="ไม่เอา"]{background:#4a2020;color:#ff9f9f;border-color:#6b2c2c}
  textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 12px;font-size:15.5px;font-family:inherit;resize:vertical;
    min-height:54px;transition:border-color .18s}
  textarea:focus{outline:none;border-color:#4a5262}
  .stamp{font-size:13.5px;color:var(--dim);margin-top:7px;min-height:19px}
  .stamp b{color:#8fd6a6}
  .saving{color:var(--gold)} .err{color:#ff8f8f}

  /* โครงร่างตอนโหลด ทำให้รู้สึกเร็วขึ้น */
  .sk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    height:66px;margin-bottom:9px;position:relative;overflow:hidden}
  .sk::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,#ffffff0a 45%,transparent);
    animation:shim 1.15s infinite}
  @keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

  .empty{text-align:center;color:var(--dim);padding:40px 16px;font-size:17px}
  .more{display:block;width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:13px;font-size:17px;font-family:inherit;cursor:pointer;margin:4px 0 10px;
    transition:transform .12s}
  .more:active{transform:scale(.98)}

  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));
    transform:translate(-50%,16px);background:#232833;color:var(--text);
    border:1px solid var(--line);border-radius:999px;padding:11px 20px;font-size:15.5px;
    z-index:60;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
    box-shadow:0 10px 30px #0008}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .mask{position:fixed;inset:0;z-index:99;background:#0f1115f5;display:flex;
    align-items:center;justify-content:center;padding:24px;animation:fade .2s ease both}
  .ask{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;
    width:100%;max-width:400px;box-shadow:0 20px 60px #000a}
  .ask h2{margin:0 0 6px;font-size:22px;color:var(--gold)}
  .ask p{margin:0 0 16px;font-size:15.5px;color:var(--dim)}
  .ask input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:13px 15px;font-size:18px;font-family:inherit;margin-bottom:14px}
  .ask button{width:100%;background:var(--gold);color:#1a1200;border:0;border-radius:11px;
    padding:14px;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer}
</style>
</head>
<body>

<header id="hdr">
  <div class="top">
    <img class="logo" src="icon-192.png" alt="">
    <h1>MKIS hunter</h1>
    <span class="who" id="who">—</span>
  </div>
  <div class="rowline">
    <select id="selGroup"></select>
    <select id="selZone"></select>
  </div>
  <div class="rowline">
    <input type="search" id="q" placeholder="ค้นชื่อ / พื้นที่ / เบอร์">
  </div>
  <div class="chips">
    <button class="chip" id="cMine">⭐ ของฉัน</button>
    <button class="chip" id="cBook">🔒 จองแล้ว</button>
    <button class="chip" id="cLeft">ยังว่าง</button>
    <button class="chip" id="cHot">เด่น</button>
    <button class="chip" id="cOpen">กางทั้งหมด</button>
  </div>
</header>

<div class="bar" id="bar"><span class="sync" id="sync"></span><span id="barTxt">กำลังโหลด…</span></div>
<main id="list"></main>
<div class="toast" id="toast"></div>

<script>
var API = "https://script.google.com/macros/s/AKfycbzW3T6Lhi1Ez1CcNUHOFESSmRA30m02XfniDAkJ87CvC_2n2z3C55e5ndDXRh5BJKzuXw/exec";

var DATA = { targets: [], results: {} };
var group = "all", zone = "all";
var fMine = false, fBook = false, fLeft = false, fHot = false, expandAll = false;
var shown = 40, openIds = {}, pending = {}, inflight = 0;

var BOOK = "จองไว้";
var STATUS = [BOOK, "ไม่ติด", "คุยแล้ว", "ส่งตัวอย่าง", "สั่งแล้ว", "ไม่เอา"];
var DOT = { "จองไว้":"book", "ไม่ติด":"miss", "คุยแล้ว":"talked", "ส่งตัวอย่าง":"sample", "สั่งแล้ว":"order", "ไม่เอา":"reject" };
var BADGE = {
  robot:{t:"⭐ หุ่นยนต์เชื่อม",c:"robot"}, jp:{t:"🏭 ทุนต่างชาติ",c:"jp"},
  brand:{t:"🔧 รู้แบรนด์เครื่อง",c:"brand"}, paint:{t:"🎨 บอกยี่ห้อสี",c:"robot"},
  booth:{t:"🔥 มีห้องอบสี",c:"brand"}, oem:{t:"🚗 ศูนย์มาตรฐานค่ายรถ",c:"jp"},
  ins:{t:"🛡️ อู่ในเครือประกัน",c:"brand"},
  mold:{t:"🧩 ทำแม่พิมพ์ (ใช้ทรายละเอียดเยอะ)",c:"robot"},
  coat:{t:"🎨 มีงานพ่นสี/ชุบ",c:"brand"},
  jobshop:{t:"🔥 รับงานจากหลายโรงงาน",c:"robot"},
  oemsup:{t:"🔗 ยืนยันส่งค่ายรถ",c:"jp"},
  belt:{t:"⚠️ ใช้สายพานเป็นหลัก — เราไม่ถนัด",c:"warn"},
  warn:{t:"⚠️ ไม่ใช่ลูกค้า",c:"warn"}
};
var HOT = ["robot","jp","paint","booth","oem","mold","jobshop","oemsup"];

function ls(k, v){
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }
  catch(e){ return null; }
}
function me(){ return ls("mb_who") || ""; }
function tel(p){ return String(p || "").replace(/[^0-9+]/g, ""); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

var toastTimer = null;
function toast(msg, isErr){
  var t = document.getElementById("toast");
  t.innerHTML = isErr ? '<span class="err">' + esc(msg) + '</span>' : esc(msg);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function syncBusy(on){
  var s = document.getElementById("sync");
  if (on) s.classList.add("busy"); else s.classList.remove("busy");
}

function askName(force){
  if (!force && me()) return;
  var mask = document.createElement("div");
  mask.className = "mask";
  mask.innerHTML = '<div class="ask"><h2>คุณชื่ออะไร</h2>' +
    '<p>ใส่ชื่อไว้ เพื่อให้ทีมรู้ว่าใครจองเจ้าไหน และใครบันทึกผล</p>' +
    '<input type="text" id="nameIn" placeholder="เช่น ตั้ม" autocomplete="name">' +
    '<button id="nameOk">เริ่มใช้งาน</button></div>';
  document.body.appendChild(mask);
  var input = mask.querySelector("#nameIn");
  input.value = me();
  setTimeout(function(){ try { input.focus(); } catch(e){} }, 120);
  function done(){
    ls("mb_who", (input.value || "").trim() || "ไม่ระบุชื่อ");
    paintWho();
    document.body.removeChild(mask);
    render();
  }
  mask.querySelector("#nameOk").onclick = done;
  input.onkeydown = function(e){ if (e.key === "Enter") done(); };
}
function paintWho(){
  document.getElementById("who").innerHTML = "👤 <b>" + esc(me() || "ใส่ชื่อ") + "</b>";
}
paintWho();
document.getElementById("who").onclick = function(){ askName(true); };

function chip(id, name){
  var el = document.getElementById(id);
  el.onclick = function(){
    if (name === "mine"){ fMine = !fMine; el.className = "chip" + (fMine ? " mineon" : ""); }
    if (name === "book"){ fBook = !fBook; el.className = "chip" + (fBook ? " on" : ""); }
    if (name === "left"){ fLeft = !fLeft; el.className = "chip" + (fLeft ? " on" : ""); }
    if (name === "hot"){  fHot  = !fHot;  el.className = "chip" + (fHot  ? " on" : ""); }
    if (name === "open"){
      expandAll = !expandAll; el.className = "chip" + (expandAll ? " on" : "");
      el.textContent = expandAll ? "ย่อทั้งหมด" : "กางทั้งหมด";
    }
    shown = 40; render();
  };
}
chip("cMine","mine"); chip("cBook","book"); chip("cLeft","left"); chip("cHot","hot"); chip("cOpen","open");

var qTimer = null;
document.getElementById("q").oninput = function(){
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){ shown = 40; render(); }, 180);
};

var lastY = 0;
window.addEventListener("scroll", function(){
  var y = window.scrollY || 0, hdr = document.getElementById("hdr");
  if (y > 150 && y > lastY + 6) hdr.classList.add("hide");
  else if (y < lastY - 6 || y < 90) hdr.classList.remove("hide");
  lastY = y;
}, { passive: true });

function call(params){
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
  }).join("&");
  return fetch(API + "?" + qs).then(function(r){ return r.json(); });
}

// ---------- แคชในเครื่อง ----------
var CK = "mb_cache_v2";
function cacheSave(){ try { ls(CK, JSON.stringify(DATA)); } catch(e){} }
function cacheLoad(){
  try {
    var raw = ls(CK); if (!raw) return false;
    var d = JSON.parse(raw);
    if (!d || !d.targets || !d.targets.length) return false;
    DATA = d; buildSelects(); render(); return true;
  } catch(e){ return false; }
}

function skeleton(n){
  var h = "";
  for (var i = 0; i < n; i++) h += '<div class="sk"></div>';
  document.getElementById("list").innerHTML = h;
}

function load(quiet){
  syncBusy(true);
  return call({ action: "list", t: Date.now() })
    .then(function(d){
      if (!d.ok) throw new Error(d.error || "");
      // ถ้ามีรายการที่กำลังเซฟอยู่ ให้ของในเครื่องชนะ กันรีเฟรชมาทับ
      var keep = {};
      Object.keys(pending).forEach(function(id){ keep[id] = DATA.results[id]; });
      DATA = d;
      Object.keys(keep).forEach(function(id){
        if (keep[id]) DATA.results[id] = keep[id]; else delete DATA.results[id];
      });
      cacheSave(); buildSelects(); render();
    })
    .catch(function(e){
      if (!quiet) {
        document.getElementById("list").innerHTML =
          '<div class="empty"><span class="err">โหลดไม่ได้</span><br><br>เช็คเน็ตแล้วลองใหม่อีกครั้ง</div>';
      } else toast("อัปเดตไม่สำเร็จ ใช้ข้อมูลที่บันทึกไว้", true);
    })
    .then(function(){ syncBusy(false); });
}

// ---------- บันทึก: เห็นผลทันที + ไม่ให้ชื่อค้าง ----------
function saveFor(t, status, note, redraw){
  if (!me()) { askName(true); return; }
  var clearing = !status && !String(note || "").trim();
  var prev = DATA.results[t.id];

  if (clearing) delete DATA.results[t.id];
  else DATA.results[t.id] = { status: status, note: note, who: me(), at: "เมื่อสักครู่" };

  pending[t.id] = 1; inflight++; syncBusy(true);
  if (redraw) refreshCard(t); else render();
  updateBar();

  call({
    action: "save", id: t.id,
    name: clearing ? "" : t.n,
    status: clearing ? "" : status,
    note: clearing ? "" : note,
    who: clearing ? "" : me()
  }).then(function(res){
    if (!res.ok) throw new Error("");
    if (!clearing) DATA.results[t.id] = { status: status, note: note, who: me(), at: res.at };
    cacheSave();
    if (redraw) refreshCard(t);
    updateBar();
  }).catch(function(){
    if (prev) DATA.results[t.id] = prev; else delete DATA.results[t.id];
    if (redraw) refreshCard(t); else render();
    updateBar();
    toast("บันทึกไม่สำเร็จ ลองใหม่", true);
  }).then(function(){
    delete pending[t.id]; inflight--;
    if (inflight <= 0) { inflight = 0; syncBusy(false); }
  });
}

function uniq(key, rows){
  var out = [], seen = {};
  rows.forEach(function(t){ if (t[key] && !seen[t[key]]) { seen[t[key]] = 1; out.push(t[key]); } });
  return out;
}
function buildSelects(){
  var sg = document.getElementById("selGroup");
  if (!sg.getAttribute("data-built")) {
    sg.setAttribute("data-built", "1");
    var gs = uniq("group", DATA.targets);
    sg.innerHTML = '<option value="all">ทุกประเภท (' + DATA.targets.length + ')</option>' +
      gs.map(function(g){
        var c = DATA.targets.filter(function(t){ return t.group === g; }).length;
        return '<option value="' + esc(g) + '">' + esc(g) + ' (' + c + ')</option>';
      }).join("");
    sg.onchange = function(){ group = this.value; zone = "all"; shown = 40; fillZones(); render(); };
  }
  fillZones();
}
function fillZones(){
  var sz = document.getElementById("selZone");
  var rows = DATA.targets.filter(function(t){ return group === "all" || t.group === group; });
  var zs = uniq("zone", rows);
  sz.innerHTML = '<option value="all">ทุกโซน (' + rows.length + ')</option>' +
    zs.map(function(z){
      var c = rows.filter(function(t){ return t.zone === z; }).length;
      return '<option value="' + esc(z) + '">' + esc(z) + ' (' + c + ')</option>';
    }).join("");
  sz.value = zone;
  sz.onchange = function(){ zone = this.value; shown = 40; render(); };
}

function visible(){
  var term = document.getElementById("q").value.trim().toLowerCase();
  var my = me();
  return DATA.targets.filter(function(t){
    if (group !== "all" && t.group !== group) return false;
    if (zone !== "all" && t.zone !== zone) return false;
    var r = DATA.results[t.id] || {};
    if (fMine && r.who !== my) return false;
    if (fBook && r.status !== BOOK) return false;
    if (fLeft && r.status) return false;
    if (fHot && !t.f.some(function(x){ return HOT.indexOf(x) >= 0; })) return false;
    if (term) {
      var hay = (t.n + " " + t.a + " " + t.w + " " + t.m + " " + t.p).toLowerCase();
      if (hay.indexOf(term) < 0) return false;
    }
    return true;
  });
}

function updateBar(){
  var my = me();
  var all = DATA.targets.filter(function(t){ return group === "all" || t.group === group; });
  var done = 0, mine = 0, booked = 0, c = {};
  all.forEach(function(t){
    var r = DATA.results[t.id];
    if (r && r.status) {
      done++; c[r.status] = (c[r.status] || 0) + 1;
      if (r.status === BOOK) booked++;
      if (r.who === my) mine++;
    }
  });
  document.getElementById("barTxt").innerHTML =
    "เข้าไปแล้ว <b>" + done + "</b>/" + all.length +
    " · จอง <b>" + booked + "</b>" +
    " · คุย <b>" + (c["คุยแล้ว"] || 0) + "</b>" +
    " · ตัวอย่าง <b>" + (c["ส่งตัวอย่าง"] || 0) + "</b>" +
    " · สั่ง <b>" + (c["สั่งแล้ว"] || 0) + "</b>" +
    (my ? " · ของฉัน <b>" + mine + "</b>" : "");
}

function render(){
  var rows = visible(), list = document.getElementById("list");
  updateBar();
  list.innerHTML = "";
  if (!rows.length) { list.innerHTML = '<div class="empty">ไม่มีรายการตามที่กรอง</div>'; return; }
  var frag = document.createDocumentFragment();
  rows.slice(0, shown).forEach(function(t){ frag.appendChild(itemEl(t)); });
  if (rows.length > shown) {
    var b = document.createElement("button");
    b.className = "more";
    b.textContent = "โหลดเพิ่มอีก " + Math.min(40, rows.length - shown) + " (เหลือ " + (rows.length - shown) + ")";
    b.onclick = function(){ shown += 40; render(); };
    frag.appendChild(b);
  }
  list.appendChild(frag);
}

// วาดใหม่เฉพาะการ์ดใบเดียว — ไม่ต้องวาดทั้งหน้า
// ค้นหาการ์ดสดจาก data-id เสมอ กันกรณี reference เก่าถูกแทนที่ไปแล้ว
function refreshCard(t){
  try {
    var cur = document.querySelector('.item[data-id="' + t.id + '"]');
    if (!cur || !cur.parentNode) return;
    cur.parentNode.replaceChild(itemEl(t, true), cur);
  } catch(e) {}
}

function itemEl(t, noAnim){
  var r = DATA.results[t.id] || {};
  var my = me();
  var isOpen = expandAll || openIds[t.id];
  var el = document.createElement("div");
  el.className = "item" +
    (isOpen ? " open" : "") +
    (r.status === BOOK ? " book" : "") +
    (r.who && r.who === my ? " mine" : "") +
    (r.status === "สั่งแล้ว" || r.status === "ไม่เอา" ? " shut" : "");
  el.setAttribute("data-id", t.id);
  if (noAnim) el.style.animation = "none";

  var sub = esc(t.a);
  if (r.status) sub = '<span class="tag">' + esc(r.status) + '</span>' +
    (r.who ? ' <span class="by">· ' + esc(r.who) + '</span>' : '') + ' · ' + esc(t.a);

  var booked = r.status === BOOK, mineBook = booked && r.who === my;
  var starCls = mineBook ? "star me" : (booked ? "star other" : "star");

  el.innerHTML =
    '<div class="head">' +
      '<span class="dot ' + (DOT[r.status] || "") + '"></span>' +
      '<span class="ttl"><div class="n">' + esc(t.n) + '</div><div class="sub">' + sub + '</div></span>' +
      '<button class="' + starCls + '">' + (booked ? "★" : "☆") + '</button>' +
      (t.p ? '<a class="tel" href="tel:' + tel(t.p) + '">📞</a>' : '<span class="tel off">📞</span>') +
    '</div>';

  el.querySelector(".head").onclick = function(ev){
    if (ev.target.closest(".tel") || ev.target.closest(".star")) return;
    if (expandAll) {
      expandAll = false;
      var c = document.getElementById("cOpen"); c.className = "chip"; c.textContent = "กางทั้งหมด";
      openIds = {}; openIds[t.id] = 1; render();
    } else {
      if (openIds[t.id]) delete openIds[t.id]; else openIds[t.id] = 1;
      refreshCard(t);
    }
  };

  var star = el.querySelector(".star");
  star.onclick = function(ev){
    ev.stopPropagation();
    if (!me()) { askName(true); return; }
    if (booked && !mineBook) { toast("🔒 " + r.who + " จองเจ้านี้ไว้แล้ว"); return; }
    star.classList.add("pop");
    saveFor(t, mineBook ? "" : BOOK, (DATA.results[t.id] || {}).note || "", true);
  };
  if (!isOpen) return el;

  var badges = "";
  t.f.forEach(function(f){ if (BADGE[f]) badges += '<span class="b ' + BADGE[f].c + '">' + BADGE[f].t + '</span>'; });

  var d = document.createElement("div");
  d.className = "detail";
  d.innerHTML =
    (badges ? '<div class="badges">' + badges + '</div>' : '') +
    '<div class="w">' + esc(t.w) + '</div>' +
    (t.m && t.m !== "-" ? '<div class="m"><b>' + esc(t.m) + '</b></div>' : '') +
    '<div class="links">' +
      (t.p ? '<a href="tel:' + tel(t.p) + '">📞 ' + esc(t.p) + '</a>' : '<a style="opacity:.45">ยังไม่มีเบอร์</a>') +
      (t.u ? '<a href="' + esc(t.u) + '" target="_blank" rel="noopener">เว็บ</a>' : '') +
    '</div><div class="status"></div>' +
    '<textarea placeholder="โน้ต — คุยกับใคร ใช้ยี่ห้ออะไรอยู่ นัดเมื่อไหร่"></textarea>' +
    '<div class="stamp"></div>';

  var ta = d.querySelector("textarea");
  ta.value = r.note || "";
  d.querySelector(".stamp").innerHTML = r.who ? ("บันทึกโดย <b>" + esc(r.who) + "</b> · " + esc(r.at || "")) : "";

  var sc = d.querySelector(".status");
  STATUS.forEach(function(v){
    var b = document.createElement("button");
    b.className = "s" + (r.status === v ? " on" : "");
    b.setAttribute("data-v", v);
    b.textContent = v === BOOK ? "🔖 จองไว้" : v;
    b.onclick = function(){
      var cur = (DATA.results[t.id] || {}).status;
      saveFor(t, cur === v ? "" : v, ta.value, true);
    };
    sc.appendChild(b);
  });

  var timer = null;
  ta.oninput = function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      saveFor(t, (DATA.results[t.id] || {}).status || "", ta.value, true);
    }, 1400);
  };

  el.appendChild(d);
  return el;
}

askName(false);
if (!cacheLoad()) skeleton(6);
load(true);
setInterval(function(){ if (!inflight) load(true); }, 60000);
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && !inflight) load(true);
});
</script>
</body>
</html>
